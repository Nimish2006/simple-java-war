name: CI Build

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:   # run manually like Jenkins "Build Now"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Test
        run: mvn -B test

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: war
          path: target/*.war
